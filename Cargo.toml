[package]
name = "ratclone"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tiago Correia"]
license = "MIT"
description = "A keyboard-driven terminal UI for rclone"
readme = "README.md"
repository = "https://github.com/SyscallBrain/ratclone"
keywords = ["rclone", "tui", "terminal", "cloud", "file-manager"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/packaging", "/tests/snapshots/*.snap.new", "/deny.toml"]

[dependencies]
async-trait = "0.1.92"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2.37", features = ["serde"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal", "io-util", "fs"] }
toml = "1.1"
toml_edit = "0.25"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"
tempfile = "3.27"
