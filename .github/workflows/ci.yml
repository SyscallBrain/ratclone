name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install minimum supported rclone
        run: bash scripts/install-test-rclone.sh 1.68.0 "$RUNNER_TEMP/rclone-minimum"
      - name: Test with rclone 1.68.0
        run: |
          export PATH="$RUNNER_TEMP/rclone-minimum:$PATH"
          RATCLONE_TEST_RCLONE_VERSION=1.68.0 cargo test --locked
      - name: Install current rclone release
        run: bash scripts/install-test-rclone.sh latest "$RUNNER_TEMP/rclone-current"
      - name: Test with current rclone
        run: |
          export PATH="$RUNNER_TEMP/rclone-current:$PATH"
          RATCLONE_TEST_RCLONE_VERSION=$(cat "$RUNNER_TEMP/rclone-current/version") cargo test --locked
      - name: Install minimum rclone for cancellable browser login
        run: bash scripts/install-test-rclone.sh 1.75.0 "$RUNNER_TEMP/rclone-oauth-minimum"
      - name: Test browser login cancellation with rclone 1.75.0
        run: |
          export PATH="$RUNNER_TEMP/rclone-oauth-minimum:$PATH"
          RATCLONE_TEST_RCLONE_VERSION=1.75.0 cargo test --locked --test rc_backend local_login_requires_cancellable_rclone_or_frees_port

  # Licences, advisories, banned crates and sources (deny.toml).
  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a pinned cargo-deny
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny check

  # The declared minimum Rust version must keep building.
  msrv:
    name: build on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked
